          pitch_deg: 5.0
        feet:
          front_left: [0.025, 0.000, 0.000]
          front_right: [0.025, 0.000, 0.000]
      - duration_s: 0.65
        easing: smootherstep
        body:
          height_offset_m: -0.008
          x_m: -0.006
          pitch_deg: 5.0
        feet:
          front_left: [0.025, 0.000, 0.000]
          front_right: [0.025, 0.000, 0.000]
      - duration_s: 0.95
