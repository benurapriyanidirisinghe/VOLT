      - duration_s: 0.55
        easing: smootherstep
        body:
          height_offset_m: -0.010
          x_m: -0.012
        feet: {}
      - duration_s: 0.70
        easing: smootherstep
        body:
          height_offset_m: -0.010
          x_m: -0.012
        feet:
          front_right: [0.010, 0.008, 0.035]
      - duration_s: 0.55
        easing: smootherstep
        body:
          height_offset_m: -0.010
          x_m: -0.012
        feet:
          front_right: [0.012, -0.018, 0.040]
      - duration_s: 0.55
        easing: smootherstep
        body:
          height_offset_m: -0.010
