  bow:
    description: Lower and pitch the front body while the four support feet remain fixed.
    keyframes:
      - duration_s: 0.0
        easing: smootherstep
        body: {}
        feet: {}
      - duration_s: 0.85
        easing: smootherstep
        body:
          height_offset_m: -0.010
          x_m: -0.006
          pitch_deg: 6.0
        feet: {}
      - duration_s: 0.55
        easing: smootherstep
