        body:
          y_m: 0.010
          roll_deg: 2.0
        feet:
          front_right: [0.008, 0.004, 0.038]
      - duration_s: 0.40
        easing: smootherstep
        body:
          y_m: 0.010
          roll_deg: 2.0
        feet:
          front_right: [0.008, -0.010, 0.038]
      - duration_s: 0.40
        easing: smootherstep
        body:
          y_m: 0.010
          roll_deg: 2.0
        feet:
          front_right: [0.008, 0.010, 0.038]
      - duration_s: 0.40
        easing: smootherstep
        body:
          y_m: 0.010
