        body: {}
        feet: {}

  happy_dance:
    description: Small alternating body rolls, height bounces, and front-foot lifts.
    keyframes:
      - duration_s: 0.0
        easing: smootherstep
        body: {}
        feet: {}
      - duration_s: 0.45
        easing: smootherstep
        body:
          height_offset_m: -0.005
          roll_deg: 3.5
        feet:
          front_left: [0.000, 0.000, 0.014]
      - duration_s: 0.40
        easing: smootherstep
        body:
