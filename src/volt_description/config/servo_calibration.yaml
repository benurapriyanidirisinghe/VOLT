# OPTIONAL PER-SERVO FIELD: deadband_deg (servo degrees, default 0.0).
#
# This is open-loop hardware -- nothing measures whether a servo actually
# moved. An RC servo ignores a command change smaller than its own deadband,
# and at low speed the per-frame steps here are well inside it: at a 20%
# speed slider the stance hip advances 0.071 deg per frame against a
# PCA9685 resolution step of 0.488 deg, so the pulse only changes every
# ~7 frames and the servo sits in stiction between them. deadband_deg biases
# the target in the direction of travel (smoothly, via tanh, so a joint
# reversal does not step by 2x the value) to push it past that.
#
# It defaults to 0.0 on every channel, i.e. DISABLED, and it should stay
# that way until measured: command one joint in steps of increasing size on
# the bench and note where it first visibly moves. A guessed value shows up
# as a standing position error that reverses sign with direction.
#
# Example:  front_left_leg:
#             pca_channel: 1
#             deadband_deg: 0.25

joint_order:
  - front_left_shoulder
  - front_left_leg
  - front_left_foot
  - front_right_shoulder
  - front_right_leg
  - front_right_foot
  - rear_left_shoulder
  - rear_left_leg
  - rear_left_foot
  - rear_right_shoulder
  - rear_right_leg
  - rear_right_foot

servos:
  front_left_shoulder:
    pca_channel: 3
    direction: -1
    neutral_deg: 120.0
    trim_deg: -0.02
    min_deg: 70.0
    max_deg: 160.0
    min_pulse_us: 600
    max_pulse_us: 2400
  front_left_leg:
    pca_channel: 1
    direction: 1
    neutral_deg: 60.0
    trim_deg: -0.01
    min_deg: 0.0
    max_deg: 180.0
    min_pulse_us: 600
    max_pulse_us: 2400
  # ch2 and ch5 were cross-wired: a per-channel test with raw SERVO commands
  # showed ch2 physically drives the FRONT-RIGHT foot and ch5 the FRONT-LEFT.
  # The whole servo tuple is swapped below, not just pca_channel, because
  # direction/neutral/trim/limits describe the SERVO and its linkage, not the
  # joint. Swapping only the channel would leave each joint paired with the
  # other servo's mirror convention and jump both channels 55.9 deg on the
  # first frame. Swapped wholesale, every channel receives exactly the value
  # it does today at the stand pose, so the standing geometry is unchanged.
  front_left_foot:
    pca_channel: 5
    direction: 1
    neutral_deg: 180.0
    trim_deg: 0.0
    min_deg: 30.0
    max_deg: 180.0
    min_pulse_us: 600
    max_pulse_us: 2400
  front_right_shoulder:
    pca_channel: 0
    direction: -1
    neutral_deg: 120.0
    trim_deg: 0.02
    min_deg: 70.0
    max_deg: 160.0
    min_pulse_us: 600
    max_pulse_us: 2400
  front_right_leg:
    pca_channel: 4
    direction: -1
    neutral_deg: 120.0
    trim_deg: 0.01
    min_deg: 0.0
    max_deg: 180.0
    min_pulse_us: 600
    max_pulse_us: 2400
  # Paired with ch2 -- see the note on front_left_foot. This is the servo that
  # jammed: at body_height 0.210 the cross-wiring sent it 39.8 deg against a
  # normal walking band of 54..79, i.e. 14 deg BELOW its usable travel. The
  # protective limit for it therefore belongs on the MIN side, and lives in
  # the firmware's CHANNEL_MIN_DEG[2]; min_deg cannot be raised here because
  # from_dict() enforces min_deg <= neutral_deg and this neutral is 0.
  front_right_foot:
    pca_channel: 2
    direction: -1
    neutral_deg: 0.0
    trim_deg: -6.834
    min_deg: 0.0
    max_deg: 150.0
    min_pulse_us: 600
    max_pulse_us: 2400
  rear_left_shoulder:
    pca_channel: 9
    direction: -1
    neutral_deg: 93.10
    trim_deg: -0.02
    min_deg: 50.0
    max_deg: 140.0
    min_pulse_us: 600
    max_pulse_us: 2400
  rear_left_leg:
    pca_channel: 7
    direction: 1
    neutral_deg: 60.0
    trim_deg: 0.02
    min_deg: 0.0
    max_deg: 180.0
    min_pulse_us: 600
    max_pulse_us: 2400
  rear_left_foot:
    pca_channel: 8
    direction: 1
    neutral_deg: 180.0
    trim_deg: 0.0
    min_deg: 30.0
    max_deg: 180.0
    min_pulse_us: 600
    max_pulse_us: 2400
  rear_right_shoulder:
    pca_channel: 6
    direction: -1
    neutral_deg: 104.15
    trim_deg: 0.02
    min_deg: 50.0
    max_deg: 140.0
    min_pulse_us: 600
    max_pulse_us: 2400
  rear_right_leg:
    pca_channel: 10
    direction: -1
    neutral_deg: 120.0
    trim_deg: -0.02
    min_deg: 0.0
    max_deg: 180.0
    min_pulse_us: 600
    max_pulse_us: 2400
  rear_right_foot:
    pca_channel: 11
    direction: -1
    neutral_deg: 0.0
    trim_deg: -0.01
    min_deg: 0.0
    max_deg: 150.0
    min_pulse_us: 600
    max_pulse_us: 2400
