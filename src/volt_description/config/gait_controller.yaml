volt_motion_controller:
  ros__parameters:
    use_sim_time: true
    auto_ready_pose: false
    body_height: 0.200
    control_rate: 100.0
    command_timeout: 0.60
    joint_error_limit: 0.45
    stand_duration: 4.0
    sit_duration: 4.7
    debug_gait: false
    max_joint_velocity: 4.0
    max_joint_acceleration: 18.0
    joint_smoothing_factor: 0.12
    smoothing_alpha: 0.12
