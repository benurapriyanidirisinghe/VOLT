volt_motion_controller:
  ros__parameters:
    auto_ready_pose: false
    body_height: 0.200
    # 100 Hz everywhere: the Python controller cannot hold 200 Hz on this
    # machine (measured 94 Hz with 12k missed deadlines), and the gait engine
    # is dt-based so the rate is a sampling choice, not a correctness one.
    control_rate: 100.0
    command_timeout: 0.60
    # STEP IN PLACE is persistent only while the GUI/operator heartbeat exists.
    step_keepalive_timeout: 1.0
    joint_error_limit: 0.45
    # A foot may lift only after prior-cycle joint commands and fresh measured
    # feedback have converged more tightly than the general warning threshold.
    support_joint_error_limit: 0.15
    support_command_error_limit: 0.08
    support_feedback_timeout: 0.25
    minimum_workspace_margin: 0.010
    stand_duration: 4.0
    sit_duration: 4.7
    # Natural Sit/Stand uses planted Cartesian feet and canonical IK. The rear
    # body lowers and shifts backward while the front legs remain supporting.
    natural_sit_height: 0.145
    natural_sit_rearward_shift: 0.020
    natural_sit_pitch_deg: -10.0
    debug_gait: false
    diagnostic_log_rate: 1.0
    sudden_joint_jump_deg: 10.0
    max_joint_velocity: 4.0
    max_joint_acceleration: 120.0
    joint_smoothing_alpha: 0.12
    hardware_mode: false

    # ----------------------------------------------------------------------
    # Walking. Two gaits, one engine (volt_gait_controller.py). Every value
    # here is validated at load against the TD-8130MG servo budgets: the
    # engine sweeps a full cycle at each gait's maximum command through the
    # real IK and refuses to load a configuration whose commanded joint
    # speeds exceed 80 deg/s on loaded stance joints or 190 deg/s on the
    # unloaded swing leg (firmware slew ceiling 240 deg/s). A config that
    # loads is a config the servos can physically execute.
    #
    # max_x / max_y are m/s, max_yaw rad/s; the GUI speed slider scales
    # inside these. hardware_speed_scale further derates every command
    # limit on the physical robot.
    # ----------------------------------------------------------------------
    gaits:
      # Two-beat diagonal trot. A trot carries the whole 52 N on two diagonal
      # feet, putting the front knee at 1.855 N.m at 0.200 m.
      #
      # CORRECTION, from a measurement rather than an assumption: that was
      # previously called 105% of usable stall against a guessed 1.76 N.m.
      # The robot performs a 60 mm push-up carrying 2 kg of added payload
      # without difficulty, and that demands 2.141 N.m at the same joint --
      # MORE than the trot does. Usable stall is therefore at least 2.14 N.m
      # and the trot sits at 87% or below, so stall torque is NOT what stops
      # a foot clearing.
      #
      # Stall torque is not stiffness. A servo can hold a load and still sag
      # under it, because the sag is its proportional band, not saturation --
      # which is consistent with the measured ~18 mm droop against a 20 mm
      # commanded lift. Compliance and stance traction remain open; stall
      # torque is closed.
      #
      # The fix is to stand TALLER, not to command more lift. At 0.210 m the
      # leg is 88% extended, the knee moment arm shrinks, and the same load
      # needs only 1.317 N.m (75% of usable stall). Standing taller costs
      # joint RATE, because a near-straight leg needs more joint motion per
      # unit of foot travel -- so the cycle is stretched to 2.10 s to keep the
      # peak inside the 190 deg/s clamp (firmware ceiling 240).
      #
      # Net: knee sweep 19.9 -> 42.6 deg and stride 44.6 -> 104.2 mm, at 75%
      # of usable stall instead of 105%. Body height lives in the hardware
      # profile (real_robot_profiles.yaml, REAL_DIAGNOSTIC body_height).
      trot:
        type: trot
        cycle_period: 2.10
        duty_factor: 0.62
        step_height: 0.020
        # max_x is set by the STANCE joints, not the swing ones. Stance joints
        # carry the load, so their speed ceiling comes from the servo's
        # speed-torque curve: at 0.210 m the knee runs at 75% of usable stall,
        # leaving 375 x (1 - 0.75) = 94 deg/s. Stance needs 90 deg/s at
        # max_x 0.085, so 0.080 keeps a real margin. Raising this past ~0.085
        # commands the loaded joints faster than they can physically turn.
        max_x: 0.080
        max_y: 0.05
        max_yaw: 0.50
        settle_time: 0.6
        body_sway_y: 0.0
        body_height_offset: 0.0
        velocity_filter_alpha: 0.30
        command_acceleration: 0.08
        hardware_speed_scale: 0.80
        joint_velocity_limit_deg_s: 190.0
        joint_acceleration_limit_deg_s2: 6500.0
        stance_velocity_budget_deg_s: 80.0
        swing_velocity_budget_deg_s: 190.0

      # Four-beat lateral-sequence amble (RL, FL, RR, FR a quarter cycle
      # apart). duty 0.76 keeps three feet planted at all times; body_sway_y
      # leans the body away from the swinging side each half cycle.
      amble:
        type: amble
        cycle_period: 2.0
        duty_factor: 0.76
        step_height: 0.020
        max_x: 0.05
        max_y: 0.03
        max_yaw: 0.30
        settle_time: 0.8
        body_sway_y: 0.009
        body_height_offset: 0.0
        velocity_filter_alpha: 0.25
        command_acceleration: 0.06
        hardware_speed_scale: 0.85
        joint_velocity_limit_deg_s: 190.0
        joint_acceleration_limit_deg_s2: 6500.0
        stance_velocity_budget_deg_s: 80.0
        swing_velocity_budget_deg_s: 190.0

      # RUN: a fast trot. "Fast" means fast OVER GROUND, which is not the
      # same as fast cadence -- and on this robot they pull in opposite
      # directions.
      #
      # stride = max_x * hardware_speed_scale * duty * cycle_period, so
      # raising cadence shrinks the stride unless max_x rises to compensate.
      # It cannot rise freely: validate_servo_budget caps it because the foot
      # has to cover the stride within the stance window. The frontier, at
      # duty 0.50, largest stride the budget accepts:
      #
      #     0.48 Hz -> 113 mm, 0.241 BL/s
      #     0.60 Hz -> 105 mm, 0.280 BL/s
      #     0.70 Hz ->  95 mm, 0.294 BL/s
      #     0.80 Hz ->  86 mm, 0.304 BL/s   <- peak speed over ground
      #     1.00 Hz ->  55 mm, 0.244 BL/s
      #     1.30 Hz ->  42 mm, 0.241 BL/s
      #
      # The first RUN shipped at 1.30 Hz with max_x set to the trot's x1.2,
      # which produced a 29.6 mm stride against the trot's 83.3 -- steps
      # nearly three times SMALLER at nearly three times the cadence. Tiny
      # steps lose entirely to stance slip, so the robot ran on the spot.
      # That was a parameter error: "+20% stride" was applied to the velocity
      # limit rather than to the stride.
      #
      # 0.80 Hz sits at the peak: 1.7x the trot's cadence, a slightly longer
      # stride than the trot's 83.3 mm, and 1.7x its speed over ground. Note
      # the frontier is computed against BOTH envelopes load_gait_configs
      # enforces -- the unscaled command limit binds first, and checking only
      # the hardware-scaled one overstates every rung.
      #
      # Cadence is the ladder to walk UP from here (0.80 -> 1.00 -> 1.30),
      # one recording per rung, stopping at the last rung where travel per
      # stride has not collapsed. Duty ladders DOWN separately (0.50 -> 0.47
      # -> 0.45) toward a flight phase.
      #
      # Clearance is still the open question for RUN, but it is no longer a
      # stall-torque question: see the correction on the trot above. What
      # remains is servo compliance (proportional-band droop under load) and
      # stance traction.
      run:
        type: run
        cycle_period: 1.25
        duty_factor: 0.50
        step_height: 0.026
        max_x: 0.172
        max_y: 0.05
        max_yaw: 0.50
        settle_time: 0.6
        body_sway_y: 0.0
        body_height_offset: 0.0
        velocity_filter_alpha: 0.30
        command_acceleration: 0.10
        hardware_speed_scale: 0.80
        joint_velocity_limit_deg_s: 190.0
        joint_acceleration_limit_deg_s2: 6500.0
        stance_velocity_budget_deg_s: 80.0
        swing_velocity_budget_deg_s: 190.0
