volt_motion_controller:
  ros__parameters:
    # Dedicated hardware-only fast-trot profile.  Simulation continues to load
    # gait_controller.yaml; hardware launch files select this file explicitly.
    fast_trot:
      type: physical_trot

      cycle_period: 0.68
      simulation_cycle_period: 0.42
      hardware_cycle_period: 0.68
      step_length_x: 0.055
      step_height: 0.036
      touchdown_lead_x: 0.0275
      liftoff_trail_x: -0.0275
      max_step_length_x: 0.075
      min_step_length_x: 0.020
      lateral_step_y: 0.0
      max_yaw_step: 0.08
      stance_ratio: 0.62
      swing_ratio: 0.38

      body_height_offset: -0.012
      forward_pitch_bias: 0.018
      maximum_body_roll: 0.05
      maximum_body_pitch: 0.06
      body_bob: 0.0003
      body_roll: 0.0

      velocity_filter_alpha: 0.20
      joint_smoothing_alpha: 0.22
      command_acceleration: 0.35
      joint_acceleration_limit: 18.0
      phase_tracking_error_soft_limit: 0.17453
      phase_transition_error_limit: 0.01745
      minimum_phase_rate_scale: 0.10
      stance_ground_tolerance: 0.002
      startup_ramp_time: 1.50
      shutdown_ramp_time: 1.00
      startup_stride_fraction: 0.25
      startup_cycle_speed_fraction: 0.70

      stride_scale: 1.00
      simulation_stride_scale: 1.00
      hardware_stride_scale: 0.75
      maximum_safe_stride_scale: 1.25
      simulation_speed_scale: 1.00
      hardware_speed_scale: 0.45

      simulation_max_x: 0.300
      hardware_max_x: 0.200
      max_y: 0.0
      hardware_joint_velocity_limit_deg_s: 90.0

      # User-facing physical tuning names.  Values that alias compatibility
      # fields are validated for equality by the loader.
      gait_frequency: 1.470588235
      stride_length: 0.055
      duty_factor: 0.62
      body_height: 0.188
      stance_width: 0.104
      front_foot_offset: 0.0
      rear_foot_offset: 0.0
      liftoff_blend: 0.20
      touchdown_blend: 0.20
      trot_ready_time: 1.0
      joint_velocity_limit: 90.0
      shoulder_joint_velocity_limit: 55.0
      upper_leg_joint_velocity_limit: 75.0
      knee_joint_velocity_limit: 90.0
      max_joint_command_delta_deg: 0.90
      command_smoothing: 0.22
      physical_motion_scale: 0.75
      # One serial-frame interval of commanded endpoint dwell at every contact
      # transition; this is a timing guard, not measured contact feedback.
      contact_settle_time: 0.035

      # BENCH is the mandatory first suspended test. FLOOR TEST remains below
      # 1.4 Hz; WIDE remains below 1.5 Hz and is never selected automatically.
      presets:
        bench:
          stride_scale: 0.50
          hardware_speed_scale: 0.25
          hardware_cycle_period: 0.80
          step_height: 0.028
        floor_test:
          stride_scale: 0.65
          hardware_speed_scale: 0.35
          hardware_cycle_period: 0.72
          step_height: 0.032
        wide:
          stride_scale: 0.80
          hardware_speed_scale: 0.45
          hardware_cycle_period: 0.68
          step_height: 0.036
