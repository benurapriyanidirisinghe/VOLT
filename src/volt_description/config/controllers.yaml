controller_manager:
  ros__parameters:
    # Match the Gazebo Sim physics step. A faster controller loop cannot be
    # serviced by the simulator and only adds scheduling overhead.
    update_rate: 166

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    joint_group_position_controller:
      type: position_controllers/JointGroupPositionController

    joint_trajectory_controller:
      type: joint_trajectory_controller/JointTrajectoryController


joint_group_position_controller:
  ros__parameters:
    joints:
      - front_left_shoulder
      - front_left_leg
      - front_left_foot

      - front_right_shoulder
      - front_right_leg
      - front_right_foot

      - rear_left_shoulder
      - rear_left_leg
      - rear_left_foot

      - rear_right_shoulder
      - rear_right_leg
      - rear_right_foot

    interface_name: position

joint_trajectory_controller:
  ros__parameters:
    joints:
      - front_left_shoulder
      - front_left_leg
      - front_left_foot

      - front_right_shoulder
      - front_right_leg
      - front_right_foot

      - rear_left_shoulder
      - rear_left_leg
      - rear_left_foot

      - rear_right_shoulder
      - rear_right_leg
      - rear_right_foot

    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity

gz_ros2_control:
  ros__parameters:
    # Position commands are applied as a first-order joint velocity target
    # (vel = gain * position_error).  The old 0.1 gain was so soft that
    # tracking lag was gain-dominated and load-independent; 18.0 makes the
    # URDF effort clamp the binding constraint, so a loaded joint genuinely
    # slows down.  Equivalent first-order servo time constant ~55 ms, and a
    # joint tracking 190 deg/s carries ~10 deg of realistic following error.
    position_proportional_gain: 18.0
