version: 1

# Canonical SI units except fields explicitly suffixed with _deg.  These are
# trajectory/conditioning values only; servo calibration remains in
# servo_calibration.yaml.
profiles:
  SIMULATION:
    gait: spotmicro_video_walk
    cycle_duration: 5.20
    stride_length: 0.035
    lateral_stride_width: 0.015
    step_height: 0.028
    duty_factor: 0.80
    body_height: 0.200
    body_x: 0.0
    body_y: 0.0
    body_roll_deg: 0.0
    body_pitch_deg: 0.0
