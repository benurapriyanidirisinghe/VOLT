    max_joint_velocity_deg_s: 114.0
    max_joint_acceleration_deg_s2: 1200.0
    smoothing_amount: 0.0
    touchdown_softness: 0.18
    stance_width: 0.104

  # First loaded-floor profile: one leg at a time, small stride, 40 mm toe
  # clearance, and bounded servo dynamics. Command-path lag can extend the
  # nominal 2.0 s cycle whenever filtered commands have not settled.
